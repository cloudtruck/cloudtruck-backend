name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # We don't need real MongoDB because we use mongodb-memory-server
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          # Using dummy secrets so tests pass without manual setup
          ACCESS_TOKEN_SECRET: ci_test_secret_do_not_use_in_prod
          REFRESH_TOKEN_SECRET: ci_test_refresh_do_not_use_in_prod
          MONGODB_URI: mongodb://localhost:27017/test_db