$kind: http-request
name: Create Staff Profile (internal/super-admin) - saves staffId
url: "{{baseUrl}}/staff"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": "{{userId}}",
      "name": "Ops Staff",
      "department": "operations",
      "title": "Operator"
    }
scripts:
  - type: afterResponse
    code: >-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        if (json.data && json.data._id) pm.collectionVariables.set('staffId', json.data._id);
      }
    language: text/javascript
order: 8000
