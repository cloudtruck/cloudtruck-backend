$kind: http-request
name: Login (Staff Email/Password) - saves tokens
url: "{{baseUrl}}/auth/login/staff"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "staff1@example.com",
      "password": "Staff1234",
      "deviceInfo": {
        "deviceModel": "Postman",
        "os": "Windows"
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: >-
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        const data = json.data || {};
        if (data.accessToken) pm.collectionVariables.set('accessToken', data.accessToken);
        if (data.refreshToken) pm.collectionVariables.set('refreshToken', data.refreshToken);
        if (data.user && data.user._id) pm.collectionVariables.set('userId', data.user._id);
      }
    language: text/javascript
order: 4000
