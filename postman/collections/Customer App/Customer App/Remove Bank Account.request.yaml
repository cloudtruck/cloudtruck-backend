$kind: http-request
description: >-
  Generated from cURL: curl -X DELETE
  http://localhost:5000/api/v1/customers/my-bank-accounts/<accountId> \
      -H "Authorization: Bearer <TOKEN>"

    Set Primary Bank Account

    curl -X PATCH http://localhost:5000/api/v1/customers/my-bank-accounts/<accountId>/primary \
      -H "Authorization: Bearer <TOKEN>"
url: "{{baseUrl}}/customers/my-bank-accounts/<accountId>"
method: PATCH
headers:
  Authorization: Bearer <TOKEN>
order: 15000
